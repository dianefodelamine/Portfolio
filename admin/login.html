<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Connexion au tableau de bord administrateur du portfolio de Fode Lamine Diane.">
  <meta name="keywords" content="admin, connexion, portfolio">
  <link rel="icon" href="../favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="../css/forms.css">
  <title>Admin - Connexion</title>
</head>
<body>
  <a href="#main-content" class="skip-link">Aller au contenu principal</a>
  <div class="login-container">
    <main class="login-main" id="main-content">
      <section class="login-form-section">
        <header class="login-header">
          <h1>Tableau de bord administrateur</h1>
          <p>Connexion sécurisée</p>
        </header>

        <form class="login-form" action="#" method="post">
          <div class="form-group">
            <label for="username">Nom d'utilisateur ou email</label>
            <input type="text" id="username" name="username" placeholder="Entrez votre nom d'utilisateur ou email" required />
          </div>

          <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" placeholder="Entrez votre mot de passe" required />
          </div>

          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" name="remember" />
              <span>Se souvenir de moi</span>
            </label>
            <a href="forgot-password.html" class="forgot-password">Mot de passe oublié ?</a>
          </div>

          <button type="submit" class="button-primary">Se connecter</button>
          <div class="form-footer-links">
            <p>Première connexion ? <a href="register.html">Créer un compte administrateur</a></p>
          </div>
        </form>

        <footer class="login-footer">
          <p>Contenu par défaut : cette page est un modèle de connexion qui sera connectée au backend pour l'authentification sécurisée.</p>
        </footer>
      </section>
    </main>
  </div>
  <script src="../js/admin.js"></script>
</body>
</html>
