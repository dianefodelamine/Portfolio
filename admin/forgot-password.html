<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Réinitialisation du mot de passe administrateur pour le portfolio.">
  <link rel="icon" href="../favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="../css/forms.css">
  <title>Admin - Mot de passe oublié</title>
</head>
<body>
  <a href="#main-content" class="skip-link">Aller au contenu principal</a>
  <div class="login-container">
    <main class="login-main" id="main-content">
      <section class="login-form-section">
        <header class="login-header">
          <h1>Mot de passe oublié</h1>
          <p>Entrez votre email ou votre nom d'utilisateur pour recevoir un lien de réinitialisation.</p>
        </header>

        <form class="forgot-password-form" action="#" method="post">
          <div class="form-group">
            <label for="email">Adresse email</label>
            <input type="email" id="email" name="email" placeholder="Email associé au compte" />
          </div>

          <div class="form-group">
            <label for="username">Nom d'utilisateur</label>
            <input type="text" id="username" name="username" placeholder="Nom d'utilisateur" />
          </div>

          <div class="reset-url-container"></div>

          <button type="submit" class="button-primary">Envoyer la demande</button>
        </form>

        <footer class="login-footer">
          <p>Retour à la connexion : <a href="login.html">Se connecter</a></p>
        </footer>
      </section>
    </main>
  </div>
  <script src="../js/admin.js"></script>
</body>
</html>
