<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Définir un nouveau mot de passe administrateur.">
  <link rel="icon" href="../favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="../css/forms.css">
  <title>Admin - Réinitialisation mot de passe</title>
</head>
<body>
  <a href="#main-content" class="skip-link">Aller au contenu principal</a>
  <div class="login-container">
    <main class="login-main" id="main-content">
      <section class="login-form-section">
        <header class="login-header">
          <h1>Réinitialiser le mot de passe</h1>
          <p>Entrez votre nouveau mot de passe. Si vous avez reçu un lien, le token sera chargé automatiquement.</p>
        </header>

        <form class="reset-password-form" action="#" method="post">
          <input type="hidden" id="token" name="token" value="" />

          <div class="token-notice hidden">
            <p>Le jeton de réinitialisation n'a pas été trouvé. Veuillez utiliser le lien envoyé par email.</p>
          </div>

          <div class="form-group">
            <label for="password">Nouveau mot de passe</label>
            <input type="password" id="password" name="password" placeholder="Entrez votre nouveau mot de passe" required />
          </div>

          <div class="form-group">
            <label for="confirm-password">Confirmez le mot de passe</label>
            <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirmez le mot de passe" required />
          </div>

          <button type="submit" class="button-primary">Réinitialiser</button>
        </form>

        <footer class="login-footer">
          <p>Retour à la connexion : <a href="login.html">Se connecter</a></p>
        </footer>
      </section>
    </main>
  </div>
  <script src="../js/admin.js"></script>
</body>
</html>
